<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title"><title id="title">Lenguajes por bytes en repositorios públicos propios, sin forks; no mide dominio personal</title><rect width="960" height="240" rx="14" fill="#110D21"/><rect x="1" y="1" width="958" height="238" rx="14" fill="none" stroke="#41305F"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="34" font-size="22" fill="#55ECF4">REPOSITORY LANGUAGES</text><text x="24" y="58" font-size="14" fill="#DAD4EB">Bytes de código en repositorios propios públicos, sin forks. No mide dominio.</text><text x="24" y="85" font-size="14" fill="#DAD4EB">TypeScript</text><rect x="155" y="73" width="570" height="12" rx="3" fill="#B86AF1"/><text x="750" y="85" font-size="14" fill="#DAD4EB">341,561 bytes</text><text x="24" y="114" font-size="14" fill="#DAD4EB">CSS</text><rect x="155" y="102" width="402" height="12" rx="3" fill="#B86AF1"/><text x="750" y="114" font-size="14" fill="#DAD4EB">240,946 bytes</text><text x="24" y="143" font-size="14" fill="#DAD4EB">HTML</text><rect x="155" y="131" width="259" height="12" rx="3" fill="#B86AF1"/><text x="750" y="143" font-size="14" fill="#DAD4EB">155,480 bytes</text><text x="24" y="172" font-size="14" fill="#DAD4EB">JavaScript</text><rect x="155" y="160" width="92" height="12" rx="3" fill="#B86AF1"/><text x="750" y="172" font-size="14" fill="#DAD4EB">55,411 bytes</text><text x="24" y="201" font-size="14" fill="#DAD4EB">Python</text><rect x="155" y="189" width="40" height="12" rx="3" fill="#B86AF1"/><text x="750" y="201" font-size="14" fill="#DAD4EB">24,228 bytes</text></g></svg>
